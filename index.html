<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/brand/niche-mark.png" />
    <meta name="apple-mobile-web-app-title" content="Niche" />
    <meta name="theme-color" content="#ECECEC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Niche</title>
    <script>
      // Aplica el tema antes de dibujar la pagina para que no parpadee en claro
      try {
        const saved = localStorage.getItem('niche-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <style>
      /* Pantalla de carga: el logo del gancho y abajo "Niche".
         Vive aqui para verse desde el primer instante; React (SplashScreen.tsx) usa las mismas clases */
      .brand-mark {
        display: inline-block;
        background-color: currentColor;
        -webkit-mask: url('/brand/niche-mark.png') center / contain no-repeat;
        mask: url('/brand/niche-mark.png') center / contain no-repeat;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #000000;
        font-family: 'Geist Variable', system-ui, sans-serif;
      }
      .dark .splash {
        background: #000000;
        color: #ffffff;
      }
      .splash-icon {
        width: 80px;
        height: 80px;
        transform-origin: 50% 0;
        animation: splash-swing 1.4s ease-in-out infinite alternate;
      }
      .splash-word {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      @keyframes splash-swing {
        from { transform: rotate(-10deg); }
        to { transform: rotate(10deg); }
      }
      @keyframes splash-pulse {
        from { opacity: 1; }
        to { opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-icon { animation-name: splash-pulse; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Cargando Niche">
        <span class="brand-mark splash-icon" aria-hidden="true"></span>
        <p class="splash-word">Niche</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
