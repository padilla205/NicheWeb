<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" as="image" href="/brand/niche-mark.png" />
    <meta name="apple-mobile-web-app-title" content="Niche" />
    <meta name="theme-color" content="#ECECEC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0B0B" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Niche · Tu closet digital</title>
    <!-- Lo que se ve al compartir el link (WhatsApp, Instagram, Facebook, X) y en Google -->
    <meta name="description" content="Guarda tus prendas, arma outfits, comparte tus fits y vende lo que ya no usas. Beta abierta y gratis." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Niche" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://niche-web-alpha.vercel.app/" />
    <meta property="og:title" content="Niche · Tu closet digital" />
    <meta property="og:description" content="Guarda tus prendas, arma outfits, comparte tus fits y vende lo que ya no usas. Beta abierta y gratis." />
    <meta property="og:image" content="https://niche-web-alpha.vercel.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Niche, tu closet digital: prendas sobre un fondo claro junto al logo del gancho" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Niche · Tu closet digital" />
    <meta name="twitter:description" content="Guarda tus prendas, arma outfits, comparte tus fits y vende lo que ya no usas." />
    <meta name="twitter:image" content="https://niche-web-alpha.vercel.app/og.jpg" />
    <script>
      // Aplica el tema antes de dibujar la pagina para que no parpadee en claro
      try {
        const saved = localStorage.getItem('niche-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <style>
      /* Pantalla de carga: el logo del gancho y abajo "Niche".
         Vive aqui para verse desde el primer instante; React (SplashScreen.tsx) usa las mismas clases */
      .brand-mark {
        display: inline-block;
        background-color: currentColor;
        -webkit-mask: url('/brand/niche-mark.png') center / contain no-repeat;
        mask: url('/brand/niche-mark.png') center / contain no-repeat;
      }
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #000000;
        font-family: 'Geist Variable', system-ui, sans-serif;
      }
      .dark .splash {
        background: #000000;
        color: #ffffff;
      }
      .splash-icon {
        width: 80px;
        height: 80px;
        transform-origin: 50% 0;
        animation: splash-swing 1.4s ease-in-out infinite alternate;
      }
      .splash-word {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      @keyframes splash-swing {
        from { transform: rotate(-10deg); }
        to { transform: rotate(10deg); }
      }
      @keyframes splash-pulse {
        from { opacity: 1; }
        to { opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-icon { animation-name: splash-pulse; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Cargando Niche">
        <span class="brand-mark splash-icon" aria-hidden="true"></span>
        <p class="splash-word">Niche</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
