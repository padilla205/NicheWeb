<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Niche</title>
    <script>
      // Aplica el tema antes de dibujar la pagina para que no parpadee en claro
      try {
        const saved = localStorage.getItem('niche-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch {}
    </script>
    <style>
      /* Pantalla de carga: una playera que se mece como colgada de un gancho y abajo "Niche".
         Vive aqui para verse desde el primer instante; React (SplashScreen.tsx) usa las mismas clases */
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        color: #000000;
        font-family: 'Geist Variable', system-ui, sans-serif;
      }
      .dark .splash {
        background: #000000;
        color: #ffffff;
      }
      .splash-icon {
        width: 56px;
        height: 56px;
        transform-origin: 50% 0;
        animation: splash-swing 1.4s ease-in-out infinite alternate;
      }
      .splash-word {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      @keyframes splash-swing {
        from { transform: rotate(-10deg); }
        to { transform: rotate(10deg); }
      }
      @keyframes splash-pulse {
        from { opacity: 1; }
        to { opacity: 0.5; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-icon { animation-name: splash-pulse; }
      }
    </style>
  </head>
  <body>
        <div id="root">
      <div class="splash" role="status" aria-label="Cargando Niche">
        <svg class="splash-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/></svg>
        <p class="splash-word">Niche</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
